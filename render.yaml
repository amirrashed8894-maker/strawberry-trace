services:
  - type: web
    runtime: static
    name: strawberry-trace
    buildCommand: "true"
    staticPublishPath: ./
    routes:
      - type: rewrite
        source: /c/*
        destination: /index.html
      - type: rewrite
        source: /admin
        destination: /index.html
      - type: rewrite
        source: /admin/*
        destination: /index.html
